name: Release v0.1.166

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.1.166.yml"
      - "custom_components/eltako_sensors_actuators/**"
      - "hacs.json"
      - ".gitignore"
      - "tests/test_fks_sv_room_temperature.py"
      - "tests/test_serialx_rx.py"
      - "tests/test_f2l14_sender_id.py"
      - "tests/test_frw_fah.py"
      - "RELEASE_NOTES_v0.1.166.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regression:
    name: Validate code and regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Validate integration and package metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/eltako_sensors_actuators')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.1.166', manifest['version']
          assert manifest['requirements'] == ['serialx>=1.15.1']
          hacs = json.loads(Path('hacs.json').read_text(encoding='utf-8'))
          assert hacs['zip_release'] is True
          assert hacs['filename'] == 'ELTAKO_Sensors_Actuators.zip'
          assert hacs['homeassistant'] == '2026.11.0'
          assert not list(root.rglob('*.pyc')), 'Tracked/generated .pyc files must not be present'
          assert not list(root.rglob('__pycache__')), 'Tracked/generated __pycache__ directories must not be present'
          for path in root.rglob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          for path in root.rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('Manifest, JSON, bytecode hygiene and Python syntax OK')
          PY
      - name: FKS-SV / FHK14 room-temperature regression
        run: python tests/test_fks_sv_room_temperature.py
      - name: Fragmented ESP2 receive and battery-ID regression
        run: python tests/test_serialx_rx.py
      - name: F2L14 FAM-USB sender-ID regression
        run: python tests/test_f2l14_sender_id.py
      - name: FAH/FHD60SB and legacy FRW regression
        run: python tests/test_frw_fah.py

  hacs:
    name: HACS compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  publish:
    name: Update existing GitHub release v0.1.166
    runs-on: ubuntu-latest
    needs: [regression, hacs, hassfest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release-v0.1.166]')
    steps:
      - uses: actions/checkout@v4
      - name: Ensure v0.1.166 exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view v0.1.166 >/dev/null
      - name: Build Marketplace-compatible ZIP
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import zipfile
          root = Path('custom_components/eltako_sensors_actuators')
          output = Path('ELTAKO_Sensors_Actuators.zip')
          with zipfile.ZipFile(output, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file() or '__pycache__' in path.parts or path.suffix == '.pyc':
                      continue
                  archive.write(path, path.relative_to(root).as_posix())
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
              names = set(archive.namelist())
              required = {
                  '__init__.py', 'manifest.json', 'device_profiles.py',
                  'gateway.py', 'sensor.py', 'binary_sensor.py',
                  'bus/transport.py', 'serial_ports_compat.py',
                  'frontend/diagnostics-panel.js',
              }
              assert required <= names, required - names
              assert not any('__pycache__' in name or name.endswith('.pyc') for name in names)
              manifest = json.loads(archive.read('manifest.json'))
              assert manifest['version'] == '0.1.166'
          print(output, output.stat().st_size, 'bytes')
          PY
      - name: Replace existing release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v0.1.166 ELTAKO_Sensors_Actuators.zip --clobber
          gh release view v0.1.166 --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'
