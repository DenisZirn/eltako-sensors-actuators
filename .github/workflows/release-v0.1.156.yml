name: Release v0.1.156

on:
  push:
    paths:
      - .github/workflows/release-v0.1.156.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalen Release-Quellstand herstellen
        run: |
          set -euo pipefail
          cat .release/v0.1.156.part* > /tmp/v0.1.156.b64
          base64 -d /tmp/v0.1.156.b64 > /tmp/v0.1.156-source.zip
          rm -rf /tmp/v0.1.156-source
          mkdir -p /tmp/v0.1.156-source
          unzip -q /tmp/v0.1.156-source.zip -d /tmp/v0.1.156-source

          # Vorhandene Brand-Assets bleiben erhalten; der restliche Integrationsquellstand
          # wird exakt auf den getesteten v0.1.156-Stand synchronisiert.
          rsync -a --delete --exclude 'brand/' \
            /tmp/v0.1.156-source/custom_components/eltako_sensors_actuators/ \
            custom_components/eltako_sensors_actuators/

          rm -f .release/v0.1.156.part*

      - name: Version pruefen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(
              Path("custom_components/eltako_sensors_actuators/manifest.json").read_text(encoding="utf-8")
          )
          assert manifest["version"] == "0.1.156", manifest["version"]
          print("Manifest version OK:", manifest["version"])
          PY

      - name: Python-Dateien pruefen
        run: |
          python -m compileall -q custom_components/eltako_sensors_actuators

      - name: Finalen Quellstand committen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A custom_components/eltako_sensors_actuators .release
          if ! git diff --cached --quiet; then
            git commit -m "Release v0.1.156"
            git push origin HEAD:main
          fi

      - name: Tag und Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          RELEASE_SHA="$(git rev-parse origin/main)"

          if git rev-parse v0.1.156 >/dev/null 2>&1; then
            echo "Tag v0.1.156 ist bereits vorhanden."
          else
            git tag -a v0.1.156 -m "ELTAKO Sensors & Actuators v0.1.156" "$RELEASE_SHA"
            git push origin v0.1.156
          fi

          cat > release-notes.md <<'EOF'
          ## ELTAKO Sensors & Actuators v0.1.156

          ### FMS14

          - Unterstützung für FMS14 / Series-14-Multifunktions-Stromstoßschalter ergänzt.
          - Mehrkanalige FMS14 werden je Kanal als eigene Home-Assistant-Entität behandelt.
          - Schaltbefehle werden über A5-38-08 gesendet.
          - EIN: `01-00-00-09`
          - AUS: `01-00-00-08`
          - Die virtuelle Sender-ID wird für jeden Kanal unverändert aus der YAML-Konfiguration übernommen.
          - Kanalrückmeldungen werden über die jeweilige physische Kanaladresse ausgewertet (`0x70` = EIN, `0x50` = AUS).

          ### Diagnose und Protokoll

          - Diagnoseausgaben für gesendete Telegramme und effektive Sender-IDs erweitert.
          - Series-14-/ESP2-Sende- und Rückmeldepfade weiter vereinheitlicht.

          ### FHK14

          - Diagnose- und Vorarbeiten für A5-10-06 sind enthalten.
          - Die FHK14-Steuerung wird weiter validiert und ist in diesem Release noch nicht als abgeschlossen anzusehen.
          EOF

          if gh release view v0.1.156 >/dev/null 2>&1; then
            gh release edit v0.1.156 \
              --title "ELTAKO Sensors & Actuators v0.1.156" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create v0.1.156 \
              --title "ELTAKO Sensors & Actuators v0.1.156" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi
