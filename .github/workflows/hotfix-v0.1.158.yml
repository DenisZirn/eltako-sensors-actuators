name: Hotfix v0.1.158

on:
  push:
    paths:
      - .github/workflows/hotfix-v0.1.158.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrowly scoped regression fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('custom_components/eltako_sensors_actuators')
          sensor_path = root / 'sensor.py'
          binary_path = root / 'binary_sensor.py'
          manifest_path = root / 'manifest.json'
          readme_path = Path('README.md')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'Anchor not found for {label}')
              return text.replace(old, new, 1)

          # sensor.py ---------------------------------------------------------
          s = sensor_path.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '    device_key,\n    normalize_eep,',
              '    device_key,\n    legacy_device_key,\n    normalize_eep,',
              'sensor legacy_device_key import',
          )

          wall_helper = '''def _is_wall_rocker_device(device: dict[str, Any]) -> bool:\n    \"\"\"Return True for F2T55, FT55 and F4T55E wall rockers.\"\"\"\n    if not isinstance(device, dict):\n        return False\n    raw = device.get(\"raw\") if isinstance(device.get(\"raw\"), dict) else {}\n    text = \" \".join(\n        str(value or \"\")\n        for value in (\n            device.get(\"name\"),\n            device.get(\"device_type\"),\n            device.get(\"model\"),\n            device.get(\"device_family\"),\n            raw.get(\"name\"),\n            raw.get(\"device_type\"),\n            raw.get(\"model\"),\n            raw.get(\"device_family\"),\n        )\n    ).upper()\n    return any(model in text for model in (\"F2T55\", \"F4T55E\", \"FT55\"))\n\n\n'''
          s = replace_once(
              s,
              'def _is_f4t55e_device(device: dict[str, Any]) -> bool:\n',
              wall_helper + 'def _is_f4t55e_device(device: dict[str, Any]) -> bool:\n',
              'sensor wall rocker helper',
          )

          s = replace_once(
              s,
              'if not _is_fts14em_device(device) and not _is_f4t55e_device(device):',
              'if not _is_fts14em_device(device) and not _is_wall_rocker_device(device):',
              'sensor wall rocker routing',
          )

          s = replace_once(
              s,
              '    _remove_obsolete_f4t55e_rocker_entities(hass, entry, devices)\n    _migrate_flgtf_entity_ids(hass, entry, devices)',
              '    _remove_obsolete_wall_rocker_entities(hass, entry, devices)\n    _migrate_a5_12_01_registry_entities(hass, entry, devices)\n    _migrate_flgtf_entity_ids(hass, entry, devices)',
              'sensor cleanup calls',
          )

          cleanup_re = re.compile(
              r'def _remove_obsolete_f4t55e_rocker_entities\(hass, entry, devices: list\[dict\[str, Any\]\]\) -> None:\n.*?(?=def _remove_obsolete_gateway_path_entities\()',
              re.S,
          )
          cleanup_new = '''def _remove_obsolete_wall_rocker_entities(hass, entry, devices: list[dict[str, Any]]) -> None:\n    \"\"\"Remove legacy generic RPS helper sensors from F2T55/FT55/F4T55E.\"\"\"\n    try:\n        registry = er.async_get(hass)\n    except Exception:\n        return\n\n    suffixes = (\n        \"Gedrueckte Taste\",\n        \"Gedrückte Taste\",\n        \"Tastenposition\",\n        \"Signalcode\",\n        \"Letztes Telegramm\",\n    )\n    suffix_tokens = {\n        str(suffix).lower().replace(\" \", \"_\").replace(\"/\", \"_\")\n        for suffix in suffixes\n    }\n\n    for device in devices or []:\n        if not isinstance(device, dict) or not _is_wall_rocker_device(device):\n            continue\n        if normalize_eep(device.get(\"eep\")) != \"F6-02-01\":\n            continue\n\n        known_unique_ids: set[str] = set()\n        for base in {device_key(device), legacy_device_key(device)}:\n            for suffix in suffixes:\n                token = str(suffix).lower().replace(\" \", \"_\").replace(\"/\", \"_\")\n                known_unique_ids.add(f\"{DOMAIN}_{entry.entry_id}_{base}_{token}\".lower())\n\n        sender = str(device.get(\"id\") or \"\").strip().lower()\n        eep_token = normalize_eep(device.get(\"eep\")).lower()\n\n        for entity_entry in list(registry.entities.values()):\n            if getattr(entity_entry, \"config_entry_id\", None) != entry.entry_id:\n                continue\n            if not str(getattr(entity_entry, \"entity_id\", \"\")).startswith(\"sensor.\"):\n                continue\n            if getattr(entity_entry, \"platform\", None) != DOMAIN:\n                continue\n            unique_id = str(getattr(entity_entry, \"unique_id\", \"\") or \"\").lower()\n            suffix_match = any(unique_id.endswith(\"_\" + token) for token in suffix_tokens)\n            structural_match = bool(sender and sender in unique_id and eep_token in unique_id and suffix_match)\n            if unique_id not in known_unique_ids and not structural_match:\n                continue\n            try:\n                registry.async_remove(entity_entry.entity_id)\n                _LOGGER.info(\"Removed obsolete wall-rocker helper entity %s\", entity_entry.entity_id)\n            except Exception:\n                _LOGGER.exception(\"Failed to remove obsolete wall-rocker helper entity %s\", entity_entry.entity_id)\n\n\ndef _migrate_a5_12_01_registry_entities(hass, entry, devices: list[dict[str, Any]]) -> None:\n    \"\"\"Reconcile legacy A5-12-01 meter entities with the current unique IDs.\"\"\"\n    try:\n        registry = er.async_get(hass)\n    except Exception:\n        return\n\n    suffixes = (\"Zaehlerstand\", \"Aktuelle Leistung\", \"Letztes Telegramm\")\n    for device in devices or []:\n        if not isinstance(device, dict):\n            continue\n        if normalize_platform(device.get(\"platform\")) != \"sensor\":\n            continue\n        if normalize_eep(device.get(\"eep\")) != \"A5-12-01\":\n            continue\n\n        sender = str(device.get(\"id\") or \"\").strip().lower()\n        if not sender:\n            continue\n        eep_token = \"a5-12-01\"\n\n        for suffix in suffixes:\n            suffix_token = suffix.lower().replace(\" \", \"_\").replace(\"/\", \"_\")\n            desired_unique_id = _yaml_entity_unique_id(entry.entry_id, device, suffix)\n            desired_entity_id = registry.async_get_entity_id(\"sensor\", DOMAIN, desired_unique_id)\n\n            candidates = []\n            for entity_entry in list(registry.entities.values()):\n                if getattr(entity_entry, \"config_entry_id\", None) != entry.entry_id:\n                    continue\n                if getattr(entity_entry, \"platform\", None) != DOMAIN:\n                    continue\n                if not str(getattr(entity_entry, \"entity_id\", \"\")).startswith(\"sensor.\"):\n                    continue\n                unique_id = str(getattr(entity_entry, \"unique_id\", \"\") or \"\").lower()\n                if sender not in unique_id or eep_token not in unique_id:\n                    continue\n                if not unique_id.endswith(\"_\" + suffix_token):\n                    continue\n                candidates.append(entity_entry)\n\n            if desired_entity_id is None and candidates:\n                keep = candidates.pop(0)\n                try:\n                    registry.async_update_entity(keep.entity_id, new_unique_id=desired_unique_id)\n                    desired_entity_id = keep.entity_id\n                    _LOGGER.info(\"Migrated A5-12-01 meter entity %s to current unique_id\", keep.entity_id)\n                except Exception:\n                    _LOGGER.exception(\"Failed to migrate A5-12-01 meter entity %s\", keep.entity_id)\n\n            for candidate in candidates:\n                if candidate.entity_id == desired_entity_id:\n                    continue\n                try:\n                    registry.async_remove(candidate.entity_id)\n                    _LOGGER.info(\"Removed duplicate A5-12-01 meter entity %s\", candidate.entity_id)\n                except Exception:\n                    _LOGGER.exception(\"Failed to remove duplicate A5-12-01 meter entity %s\", candidate.entity_id)\n\n\n'''
          s, count = cleanup_re.subn(cleanup_new, s, count=1)
          if count != 1:
              raise SystemExit('Could not replace wall-rocker cleanup block')

          marker = '        self._value = value\n\n    @property\n    def native_value(self):\n'
          replacement = '''        self._value = value\n        if normalize_eep(self.device_config.get(\"eep\")) == \"A5-12-01\" and self.key in {\"energy_total\", \"counter\"}:\n            try:\n                self._last_valid_numeric_value = float(value)\n            except (TypeError, ValueError):\n                self._last_valid_numeric_value = None\n\n    @property\n    def native_value(self):\n'''
          class_pos = s.index('class EltakoYamlValueSensor')
          prefix, tail = s[:class_pos], s[class_pos:]
          tail = replace_once(tail, marker, replacement, 'meter restore seed')
          s = prefix + tail

          meter_re = re.compile(
              r'        if configured_eep == \"A5-12-01\":\n.*?\n        if self\.key not in telegram\.decoded:\n',
              re.S,
          )
          meter_new = '''        if configured_eep == \"A5-12-01\":\n            if _is_db0_typed_a5_12_01_meter(self.device_config):\n                db0_meter_decoded = _decode_db0_typed_a5_12_01_meter(self.device_config, telegram.decoded)\n                if db0_meter_decoded:\n                    telegram.decoded.update(db0_meter_decoded)\n\n            if self.key in {\"energy_total\", \"counter\"}:\n                if not telegram.decoded.get(\"is_meter_reading\", False):\n                    return\n                if not _meter_telegram_matches_config(self.device_config, telegram.decoded):\n                    return\n                if self.key not in telegram.decoded:\n                    return\n                try:\n                    numeric_value = float(telegram.decoded[self.key])\n                except (TypeError, ValueError):\n                    return\n                if self._last_valid_numeric_value is not None:\n                    if numeric_value == 0 and self._last_valid_numeric_value > 0:\n                        return\n                    if numeric_value < self._last_valid_numeric_value:\n                        return\n                self._last_valid_numeric_value = numeric_value\n                self._value = numeric_value\n                self.schedule_update_ha_state()\n                return\n\n            if self.key == \"last_seen\":\n                raw_seen = telegram.decoded.get(\"last_seen\")\n                if raw_seen is None:\n                    raw_seen = datetime.now().astimezone().isoformat()\n                self._value = _format_timestamp_seconds(raw_seen)\n                self.schedule_update_ha_state()\n                return\n\n            if self.key == \"current_power\":\n                if not _meter_telegram_matches_config(self.device_config, telegram.decoded):\n                    return\n                if telegram.decoded.get(\"is_power_reading\", False) and \"current_power\" in telegram.decoded:\n                    new_value = telegram.decoded[\"current_power\"]\n                elif \"energy_total\" in telegram.decoded:\n                    derived_power = self._derive_power_from_energy_sample(telegram.decoded)\n                    if derived_power is None:\n                        return\n                    new_value = derived_power\n                else:\n                    return\n                self._value = new_value\n                self.schedule_update_ha_state()\n                return\n\n        if self.key not in telegram.decoded:\n'''
          s, count = meter_re.subn(meter_new, s, count=1)
          if count != 1:
              raise SystemExit('Could not replace A5-12-01 update block')

          sensor_path.write_text(s, encoding='utf-8')

          # binary_sensor.py --------------------------------------------------
          b = binary_path.read_text(encoding='utf-8')
          b = replace_once(
              b,
              'from homeassistant.helpers.event import async_call_later\n',
              'from homeassistant.helpers.event import async_call_later\nfrom homeassistant.helpers import entity_registry as er\n',
              'binary entity registry import',
          )
          b = replace_once(
              b,
              '_fts14em_inverted, normalize_eep, normalize_platform',
              '_fts14em_inverted, device_key, legacy_device_key, normalize_eep, normalize_platform',
              'binary identity imports',
          )
          b = replace_once(
              b,
              '_LOGGER = logging.getLogger(__name__)\n\n\nasync def async_setup_entry',
              '_LOGGER = logging.getLogger(__name__)\n\n\ndef _is_wall_rocker_device(device: dict[str, Any]) -> bool:\n    \"\"\"Return True for F2T55, FT55 and F4T55E wall rockers.\"\"\"\n    if not isinstance(device, dict):\n        return False\n    raw = device.get(\"raw\") if isinstance(device.get(\"raw\"), dict) else {}\n    text = \" \".join(str(value or \"\") for value in (device.get(\"name\"), device.get(\"device_type\"), device.get(\"model\"), device.get(\"device_family\"), raw.get(\"name\"), raw.get(\"device_type\"), raw.get(\"model\"), raw.get(\"device_family\"))).upper()\n    return any(model in text for model in (\"F2T55\", \"F4T55E\", \"FT55\"))\n\n\nasync def async_setup_entry',
              'binary wall rocker helper',
          )
          b = replace_once(
              b,
              '        if _is_fts14em_device(device) and eep == \"F6-02-01\":\n            entities.append(EltakoFTS14EMInputBinarySensor(gateway, device))\n            continue\n\n        if _is_f4usm61b_device(device):',
              '        if _is_fts14em_device(device) and eep == \"F6-02-01\":\n            entities.append(EltakoFTS14EMInputBinarySensor(gateway, device))\n            continue\n\n        if _is_wall_rocker_device(device) and eep == \"F6-02-01\":\n            entities.extend(_rocker_position_entities(gateway, device))\n            continue\n\n        if _is_f4usm61b_device(device):',
              'binary wall rocker routing',
          )
          b = replace_once(
              b,
              '    _LOGGER.info(\n        \"ELTAKO binary_sensor setup entry=%s imported_devices=%s binary_entities=%s\",',
              '    _remove_obsolete_wall_rocker_binary_entities(hass, entry, devices)\n\n    _LOGGER.info(\n        \"ELTAKO binary_sensor setup entry=%s imported_devices=%s binary_entities=%s\",',
              'binary cleanup call',
          )
          cleanup_binary = '''\n\ndef _remove_obsolete_wall_rocker_binary_entities(hass, entry, devices: list[dict[str, Any]]) -> None:\n    \"\"\"Remove the obsolete unsuffixed generic wall-rocker binary sensor.\"\"\"\n    try:\n        registry = er.async_get(hass)\n    except Exception:\n        return\n\n    for device in devices or []:\n        if not isinstance(device, dict) or not _is_wall_rocker_device(device):\n            continue\n        if normalize_eep(device.get(\"eep\")) != \"F6-02-01\":\n            continue\n        known_unique_ids = {\n            f\"{DOMAIN}_{entry.entry_id}_{device_key(device)}\".lower(),\n            f\"{DOMAIN}_{entry.entry_id}_{legacy_device_key(device)}\".lower(),\n        }\n        for entity_entry in list(registry.entities.values()):\n            if getattr(entity_entry, \"config_entry_id\", None) != entry.entry_id:\n                continue\n            if not str(getattr(entity_entry, \"entity_id\", \"\")).startswith(\"binary_sensor.\"):\n                continue\n            if getattr(entity_entry, \"platform\", None) != DOMAIN:\n                continue\n            unique_id = str(getattr(entity_entry, \"unique_id\", \"\") or \"\").lower()\n            if unique_id not in known_unique_ids:\n                continue\n            try:\n                registry.async_remove(entity_entry.entity_id)\n                _LOGGER.info(\"Removed obsolete generic wall-rocker entity %s\", entity_entry.entity_id)\n            except Exception:\n                _LOGGER.exception(\"Failed to remove obsolete wall-rocker entity %s\", entity_entry.entity_id)\n\n\n'''
          b = replace_once(
              b,
              '\ndef _a5_20_01_status_entities(gateway, device: dict[str, Any]) -> list[BinarySensorEntity]:\n',
              cleanup_binary + 'def _a5_20_01_status_entities(gateway, device: dict[str, Any]) -> list[BinarySensorEntity]:\n',
              'binary cleanup function',
          )
          binary_path.write_text(b, encoding='utf-8')

          # Version and README ------------------------------------------------
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = '0.1.158'
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          readme = readme_path.read_text(encoding='utf-8')
          readme = replace_once(
              readme,
              '## Freigegebener Gerätekatalog (v0.1.157)',
              '## Freigegebener Gerätekatalog (v0.1.158)',
              'README release version',
          )
          readme_path.write_text(readme, encoding='utf-8')
          PY

      - name: Regression guard and syntax check
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess

          root = Path('custom_components/eltako_sensors_actuators')
          for path in root.rglob('*.py'):
              compile(path.read_text(encoding='utf-8'), str(path), 'exec')

          sensor = (root / 'sensor.py').read_text(encoding='utf-8')
          binary = (root / 'binary_sensor.py').read_text(encoding='utf-8')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))

          assert manifest['version'] == '0.1.158'
          assert 'def _migrate_a5_12_01_registry_entities' in sensor
          assert 'if self.key == "last_seen":' in sensor
          assert 'def _is_wall_rocker_device' in sensor
          assert 'def _is_wall_rocker_device' in binary
          assert '_remove_obsolete_wall_rocker_entities(hass, entry, devices)' in sensor
          assert '_remove_obsolete_wall_rocker_binary_entities(hass, entry, devices)' in binary
          # FAH/FRW-ws are intentionally deferred to the next feature release.
          assert '_is_frw_ws_device' not in sensor
          assert '_is_frw_ws_device' not in binary

          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          expected = sorted([
              'README.md',
              'custom_components/eltako_sensors_actuators/binary_sensor.py',
              'custom_components/eltako_sensors_actuators/manifest.json',
              'custom_components/eltako_sensors_actuators/sensor.py',
          ])
          if sorted(changed) != expected:
              raise SystemExit(f'Unexpected changed files: {changed}')
          print('Regression guard OK. Changed files:', ', '.join(changed))
          PY

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md custom_components/eltako_sensors_actuators/sensor.py custom_components/eltako_sensors_actuators/binary_sensor.py custom_components/eltako_sensors_actuators/manifest.json
          git commit -m "Hotfix v0.1.158: meter and rocker regressions"
          git push origin HEAD:main

      - name: Create v0.1.158 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -a v0.1.158 -m "ELTAKO Sensors & Actuators v0.1.158"
          git push origin v0.1.158
          cat > /tmp/release-notes.md <<'EOF'
          ## ELTAKO Sensors & Actuators v0.1.158

          ### Fehlerbehebungen

          - Fehler bei der Aktualisierung von **FWZ14-65A** und **DSZ14DRS** behoben.
          - **Zählerstand**, **aktuelle Leistung** und **Letztes Telegramm** werden wieder korrekt aktualisiert.
          - Fehlerhafte bzw. veraltete Zusatzentitäten bei **F2T55, FT55 und F4T55E** entfernt.
          - Bei diesen Tastern werden wieder ausschließlich die vorgesehenen Tastenentitäten angezeigt.
          - Weitere kleinere Korrekturen zur Vermeidung von Regressionen gegenüber früheren Versionen.

          ### Hinweis

          Dieses Release ist ein reines **Hotfix-Release** für v0.1.157 und enthält keine neuen Geräte oder Funktionen.
          EOF
          gh release create v0.1.158 --title "ELTAKO Sensors & Actuators v0.1.158" --notes-file /tmp/release-notes.md
