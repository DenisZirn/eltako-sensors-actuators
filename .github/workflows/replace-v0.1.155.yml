name: Replace corrected v0.1.155

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Manifest-Version pruefen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("custom_components/eltako_sensors_actuators/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          assert manifest["version"] == "0.1.155", manifest["version"]
          print("Manifest version OK:", manifest["version"])
          PY

      - name: Python-Dateien pruefen
        run: python -m compileall -q custom_components/eltako_sensors_actuators

      - name: Bestehenden Release und Tag ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          gh release delete v0.1.155 --yes --cleanup-tag || true
          git fetch --tags --force
          git tag -d v0.1.155 || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.155 -m "ELTAKO Sensors & Actuators v0.1.155 corrected" "${GITHUB_SHA}"
          git push origin v0.1.155 --force

          cat > release-notes.md <<'EOF'
          ## ELTAKO Sensors & Actuators v0.1.155 – korrigierter Release

          Dieser Release ersetzt den fehlerhaften ersten Stand von v0.1.155.

          - getestete Aktor-Rueckmeldelogik aus test22
          - RPS- und 4BS-Rueckmeldungen fuer Schalt- und Lichtaktoren
          - FSB61/FJ62 Start-, Stopp- und Laufzeitauswertung
          - korrigierte Zuordnung zur physischen Aktoradresse
          EOF

          gh release create v0.1.155 \
            --title "ELTAKO Sensors & Actuators v0.1.155" \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
