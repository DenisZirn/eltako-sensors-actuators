name: Replace v0.1.155 with exact test22

on:
  push:
    paths:
      - .github/workflows/replace-v0.1.155.yml

permissions:
  contents: write

jobs:
  replace-release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Exakte test22-Rueckmeldedateien wiederherstellen
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/test22-four.tar.gz
          tar -xzf /tmp/test22-four.tar.gz

      - name: Exakte test22-Dateien verifizieren
        shell: bash
        run: |
          set -euo pipefail
          echo '2629416bca2b95bfceff78aae66ecb16a6a3cbac0d6a57c624a399b23c8cabbf  custom_components/eltako_sensors_actuators/actuator_feedback.py' | sha256sum --check
          echo '6a08350ee765fbdeed83a3a5b9dd5a42461257f08a2ae49be6282f1fa3c0b734  custom_components/eltako_sensors_actuators/switch.py' | sha256sum --check
          echo 'af33a998d3a0dbbe4dd385e077d0db3296eb5d27eca686e8d6ef286fdd3c0bdc  custom_components/eltako_sensors_actuators/light.py' | sha256sum --check
          echo '9456ac4776e19e0782ee5559662237451bb7b44ecd80a414fe37fa4c8a23e685  custom_components/eltako_sensors_actuators/cover.py' | sha256sum --check
          python -m compileall -q custom_components/eltako_sensors_actuators
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/eltako_sensors_actuators/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.1.155', manifest['version']
          print('Manifest version OK:', manifest['version'])
          PY

      - name: Exakten test22-Stand committen und v0.1.155 ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add custom_components/eltako_sensors_actuators/actuator_feedback.py \
                  custom_components/eltako_sensors_actuators/switch.py \
                  custom_components/eltako_sensors_actuators/light.py \
                  custom_components/eltako_sensors_actuators/cover.py
          if ! git diff --cached --quiet; then
            git commit -m 'Release exact hardware-tested test22 implementation as v0.1.155'
            git push origin HEAD:main
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"

          gh release delete v0.1.155 --yes --cleanup-tag || true
          git fetch --tags --force
          git tag -d v0.1.155 || true
          git tag -a v0.1.155 -m 'ELTAKO Sensors & Actuators v0.1.155 corrected' "${RELEASE_SHA}"
          git push origin v0.1.155 --force

          cat > release-notes.md <<'EOF'
          Dieser Release ersetzt den fehlerhaften ersten Stand von v0.1.155

          - Aktor-Rückmeldelogik implementiert
          - RPS- und 4BS-Rückmeldungen für Schalt- und Lichtaktoren
          - FSB61/FJ62 Start-, Stopp- und Laufzeitauswertung
          - Rückmeldungen von FSR61, FUD61, FL62, FD62 implementiert
          - korrigierte Zuordnung zur physischen Aktoradresse
          - FTFSB/FTFB mit EEP A5-04-03 wieder als Temperatur- und Feuchtesensor angelegt.
          - Ein FTFSB, der trotz A5-04-03 im YAML tatsächlich im werkseitigen A5-04-02-Modus sendet, wird anhand des Lern- und Datentelegramms automatisch erkannt.
          EOF

          gh release create v0.1.155 \
            --title 'ELTAKO Sensors & Actuators v0.1.155' \
            --notes-file release-notes.md \
            --verify-tag \
            --latest
