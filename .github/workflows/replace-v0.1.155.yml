name: Release corrected v0.1.155

on:
  push:
    paths:
      - .github/workflows/replace-v0.1.155.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version und Python-Dateien prüfen
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/eltako_sensors_actuators/manifest.json').read_text(encoding='utf-8'))
          assert manifest['version'] == '0.1.155', manifest['version']
          PY
          python -m compileall -q custom_components/eltako_sensors_actuators

      - name: Release v0.1.155 ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete v0.1.155 --yes --cleanup-tag || true
          git fetch --tags --force
          git tag -d v0.1.155 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.1.155 -m "ELTAKO Sensors & Actuators v0.1.155 corrected" "${GITHUB_SHA}"
          git push origin v0.1.155 --force
          gh release create v0.1.155 \
            --title "ELTAKO Sensors & Actuators v0.1.155" \
            --notes-file release-notes-v0.1.155.md \
            --verify-tag \
            --latest
