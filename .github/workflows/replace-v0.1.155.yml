name: Replace corrected v0.1.155

on:
  push:
    paths:
      - .github/workflows/replace-v0.1.155.yml

permissions:
  contents: write

jobs:
  replace-release:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Getestete test22-Dateien wiederherstellen
        shell: bash
        run: |
          cat > /tmp/test22-feedback.b64 <<'EOF'

EOF
          base64 --decode /tmp/test22-feedback.b64 > /tmp/test22-feedback.tar.gz
          tar -xzf /tmp/test22-feedback.tar.gz
          python -m compileall -q custom_components/eltako_sensors_actuators

      - name: Korrigierten Stand committen
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/eltako_sensors_actuators/actuator_feedback.py \
                  custom_components/eltako_sensors_actuators/switch.py \
                  custom_components/eltako_sensors_actuators/light.py \
                  custom_components/eltako_sensors_actuators/cover.py
          if ! git diff --cached --quiet; then
            git commit -m "Restore field-tested v0.1.155-test22 feedback implementation"
            git push origin HEAD:main
          fi

      - name: Bestehenden Release und Tag ersetzen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          git fetch origin main
          TARGET_SHA="$(git rev-parse origin/main)"
          gh release delete v0.1.155 --yes --cleanup-tag || true
          git push origin :refs/tags/v0.1.155 || true
          git tag -f -a v0.1.155 -m "ELTAKO Sensors & Actuators v0.1.155 corrected" "$TARGET_SHA"
          git push --force origin refs/tags/v0.1.155
          gh release create v0.1.155 \
            --target "$TARGET_SHA" \
            --title "ELTAKO Sensors & Actuators v0.1.155" \
            --notes "Corrected release based on the field-tested v0.1.155-test22 implementation. Restores switch, light and cover actuator feedback, including FSB61/FJ62 movement and STOP runtime telegram handling." \
            --latest
