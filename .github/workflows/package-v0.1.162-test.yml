name: Package v0.1.162 test

on:
  push:
    branches:
      - test/v0.1.162-i18n
  pull_request:
    branches:
      - test/v0.1.162-i18n

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: python -m compileall -q custom_components/eltako_sensors_actuators

      - name: Build integration ZIP
        run: |
          cd custom_components
          zip -r ../ELTAKO_Sensors_Actuators_v0.1.162-test-F2L14.zip eltako_sensors_actuators -x "*/__pycache__/*" "*.pyc"

      - name: Upload integration ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ELTAKO_Sensors_Actuators_v0.1.162-test-F2L14
          path: ELTAKO_Sensors_Actuators_v0.1.162-test-F2L14.zip
          if-no-files-found: error
