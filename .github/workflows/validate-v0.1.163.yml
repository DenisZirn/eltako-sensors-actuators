name: Validate ELTAKO v0.1.163

on:
  push:
    branches:
      - test/v0.1.163-device-type
  pull_request:
    paths:
      - 'custom_components/eltako_sensors_actuators/**'
      - '.github/workflows/validate-v0.1.163.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python, JSON, identity and modes
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, ast
          root = Path("custom_components/eltako_sensors_actuators")
          manifest = json.loads((root / "manifest.json").read_text())
          assert manifest["version"] == "0.1.163"
          for file in root.rglob("*.py"):
              compile(file.read_text(encoding="utf8"), str(file), "exec")
          for file in root.rglob("*.json"):
              json.loads(file.read_text(encoding="utf8"))
          en = json.loads((root / "translations/en.json").read_text())
          de = json.loads((root / "translations/de.json").read_text())
          for k in ("rocker_left_top","rocker_right_top","rocker_left_bottom","rocker_right_bottom","rocker_pressed","rocker_top","rocker_bottom"):
              assert k in en["entity"]["binary_sensor"]
              assert k in de["entity"]["binary_sensor"]
          sensor = (root / "sensor.py").read_text(encoding="utf8")
          binary = (root / "binary_sensor.py").read_text(encoding="utf8")
          yaml = (root / "yaml_config.py").read_text(encoding="utf8")
          assert '"device_type": _clean_string(item.get("device_type"))' in yaml
          assert 'def _explicit_device_type' in binary
          assert 'if _is_f4usm61b_device(device):' in binary
          assert 'elif mode == 2 and eep == "A5-38-08"' in binary
          assert 'elif mode in {3, 6} and eep == "A5-08-01"' in binary
          assert 'elif mode in {4, 7} and eep == "D5-00-01"' in binary
          assert 'elif mode == 8 and eep == "A5-07-01"' in binary
          assert 'def _ensure_last_telegram_diagnostics' in sensor
          assert 'EntityCategory.DIAGNOSTIC' in sensor
          assert 'ROCKER_ACTIVE_TIME_SECONDS' not in binary
          # Execute pure routing helpers without importing Home Assistant.
          def functions_from(path, names):
              tree = ast.parse(path.read_text(encoding="utf8"))
              ns = {"Any": object}
              import typing
              ns["Any"] = typing.Any
              code = ast.Module(body=[n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in names], type_ignores=[])
              exec(compile(code, str(path), "exec"), ns)
              return ns
          b = functions_from(root / "binary_sensor.py", {"_explicit_device_type","_device_identity_values","_legacy_device_name_text","_is_wall_rocker_device","_rocker_position_count","_is_two_channel_wall_rocker"})
          for typ,expected in [("F2T55",2),("FT55",4),("F4T55E",4)]:
              dev = {"device_type": typ, "eep":"F6-02-01", "name":"Beliebiger Name"}
              assert b["_is_wall_rocker_device"](dev), typ
              assert b["_rocker_position_count"](dev) == expected
          for typ in ("F4USM61B", "FRW-WS", "FAE14LPR", "FTS14EM"):
              dev = {"device_type":typ, "eep":"F6-02-01", "name":"F2T55 should be ignored"}
              assert not b["_is_wall_rocker_device"](dev), typ
          e = functions_from(root / "entity_base.py", {"_technical_device_type","_is_f4usm61b_device","_device_family"})
          for mode in range(1,9):
              dev = {"name":"F2T55 Name", "device_type":"F4USM61B", "operating_mode": mode}
              assert e["_is_f4usm61b_device"](dev), mode
              assert e["_device_family"](dev) == "F4USM61B"
          assert not e["_is_f4usm61b_device"]({"name":"F4USM61B", "device_type":"FT55"})
          print("v0.1.163 syntax, JSON and static mode routing passed")
          PY
