name: Retag v0.1.156

on:
  push:
    paths:
      - .github/workflows/retag-v0.1.156.yml

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move existing v0.1.156 tag to current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --tags
          SHA="$(git rev-parse origin/main)"
          git tag -fa v0.1.156 -m "ELTAKO Sensors & Actuators v0.1.156" "$SHA"
          git push origin refs/tags/v0.1.156 --force
