name: Publish v0.1.162

on:
  push:
    paths:
      - .github/workflows/release-v0.1.162.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate v0.1.162
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("custom_components/eltako_sensors_actuators")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["version"] == "0.1.162"

          for path in root.rglob("*.py"):
              compile(path.read_text(encoding="utf-8"), str(path), "exec")

          en = json.loads((root / "translations/en.json").read_text(encoding="utf-8"))
          de = json.loads((root / "translations/de.json").read_text(encoding="utf-8"))
          sensor = (root / "sensor.py").read_text(encoding="utf-8")

          assert en["entity"]["binary_sensor"]["input"]["name"] == "Input E{input}"
          assert de["entity"]["binary_sensor"]["input"]["name"] == "Eingang E{input}"
          assert en["entity"]["sensor"]["voltage"]["name"] == "Voltage"
          assert de["entity"]["sensor"]["voltage"]["name"] == "Spannung"
          assert '"voltage": "voltage"' in sensor
          assert '"FBH55"' in sensor
          assert '"FBHT"' in sensor

          print("v0.1.162 validation OK")
          PY

      - name: Recreate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## ELTAKO Sensors & Actuators v0.1.162

          ### F2L14

          - F2L14 als Home-Assistant-`fan`-Entity integriert.
          - Zwei Lüfterstufen werden als 50 % / 100 % abgebildet; 0 % entspricht Aus.
          - Unterstützung für die PCT14-Schaltfolgen `exclusive` und `additive`.
          - Native F6-02-01-Tastertelegramme:
            - `0x30` = Stufe 1
            - `0x70` = Stufe 2
            - untere Taste = Aus
          - `f2l14_mode`, `stage_1_id`, `stage_2_id` und `speed_count` werden aus der EEDTOY-YAML übernommen.
          - Rückmeldung der beiden F2L14-Stufen wird ausgewertet.
          - Unterstützung für FAM-USB und FGW14-USB/FAM14.
          - FAM-USB-Sender-ID-Mapping für bereits aufgelöste F2L14-Adressen korrigiert.
          - Telegramm-Timing für zuverlässige Stufenwechsel stabilisiert.
          - Praktisch mit realem F2L14 und PCT14 getestet.

          ### Deutsche / englische Oberfläche

          - Deutsche und englische Entity-Bezeichnungen erweitert.
          - FNSN55EB/FNS65EB: `Näherung` / `Proximity` inklusive übersetzter Zustände.
          - F6-02-01-Taster: Tastenpositionen und Diagnosewerte deutsch/englisch.
          - Redundante generische F6-02-01-`Unknown`-Entity entfernt.
          - F4USM61B Modus 1: Eingänge werden korrekt als `Input E1` bis `Input E4` bzw. `Eingang E1` bis `Eingang E4` angezeigt.
          - Spannungs-Sensoren verwenden `Voltage` / `Spannung`.
          - EnOcean-ID, Letztes Telegramm und weitere sichtbare Entity-Namen lokalisiert.

          ### FBH55 / FBHT55

          - FBH55/FBH55ESB erzeugt keine Temperatur-Entity mehr, da diese Variante keine Temperatur überträgt.
          - FBHT55/FBHT55ESB behält die Temperatur-Entity.
          - Bewegung, Helligkeit und Spannung bleiben unverändert erhalten.

          ### Kompatibilität

          - Bestehende Unique-IDs und Entity-IDs bleiben erhalten.
          - Bestehende EnOcean- und Series-14-Gerätepfade bleiben erhalten.
          - Python-Syntax und Release-Manifest wurden vor Veröffentlichung validiert.

          ### Hinweis zum F2L14

          Beim Wechsel zwischen `exclusive` und `additive` muss in PCT14 darauf geachtet werden, dass für dieselbe Sender-ID nicht gleichzeitig ein alter Eintrag mit der jeweils anderen Schaltfolge bestehen bleibt.
          EOF

          gh api -X DELETE repos/${GITHUB_REPOSITORY}/releases/412778691 || true

          gh release create v0.1.162             --title "ELTAKO Sensors & Actuators v0.1.162"             --notes-file /tmp/release-notes.md             --latest
