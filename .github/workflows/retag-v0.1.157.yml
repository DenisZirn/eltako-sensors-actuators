name: Retag v0.1.157

on:
  push:
    paths:
      - .github/workflows/retag-v0.1.157.yml

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: v0.1.157 auf aktuellen main-Stand verschieben
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa v0.1.157 -m "ELTAKO Sensors & Actuators v0.1.157" "$GITHUB_SHA"
          git push origin refs/tags/v0.1.157 --force
